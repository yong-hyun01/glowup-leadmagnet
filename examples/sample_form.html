<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무료 전자책 신청</title>
<style>
  body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:#fafafa;margin:0;padding:32px 16px}
  .box{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  h1{font-size:22px;margin:0 0 8px}p{color:#555;margin:0 0 20px}
  label{display:block;font-size:14px;margin-bottom:12px}input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:4px;font:inherit}
  button{width:100%;padding:12px;border:0;border-radius:8px;background:#ff5c8a;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <h1>피부 루틴 가이드 무료 전자책</h1>
  <p>이메일을 남겨 주시면 바로 보내드립니다.</p>
  <form>
    <label>이름 <input name="name" required placeholder="홍길동"></label>
    <label>이메일 <input name="email" type="email" required placeholder="you@example.com"></label>
    <label>연락처 <input name="phone" placeholder="010-0000-0000"></label>
    <label>관심 주제
      <select name="topic">
        <option value="skincare">스킨케어</option>
        <option value="makeup">메이크업</option>
        <option value="haircare">헤어케어</option>
      </select>
    </label>
    <button type="submit">무료로 받기</button>
  </form>
</div>
</body>
</html>
