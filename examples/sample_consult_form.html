<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무료 1:1 뷰티 상담 신청</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:32px 16px;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       background:linear-gradient(135deg,#fdf2f8 0%,#ede9fe 100%);min-height:100vh}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 10px 40px rgba(124,58,237,.12)}
  .badge{display:inline-block;background:#7c3aed;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:12px}
  h1{font-size:24px;margin:0 0 8px;color:#1f2937}
  p.lead{color:#6b7280;margin:0 0 24px;line-height:1.5}
  label{display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:14px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid #e5e7eb;border-radius:10px;margin-top:6px;font:inherit;font-weight:400}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.15)}
  textarea{min-height:90px;resize:vertical}
  .checks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px}
  .checks label{font-weight:400;margin:0;display:flex;align-items:center;gap:6px}
  .checks input{width:auto;margin:0}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}
  button:hover{background:#6d28d9}
  .note{font-size:12px;color:#9ca3af;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <span class="badge">선착순 30명</span>
  <h1>무료 1:1 뷰티 상담 신청</h1>
  <p class="lead">피부 타입과 고민을 남겨 주시면 전문 컨설턴트가 맞춤 루틴을 제안해 드립니다.</p>

  <form>
    <label>이름
      <input name="name" required placeholder="홍길동">
    </label>
    <label>연락처
      <input name="phone" type="tel" required placeholder="010-0000-0000">
    </label>
    <label>이메일
      <input name="email" type="email" placeholder="you@example.com">
    </label>
    <label>피부 타입
      <select name="skin_type" required>
        <option value="">선택해 주세요</option>
        <option value="dry">건성</option>
        <option value="oily">지성</option>
        <option value="combination">복합성</option>
        <option value="sensitive">민감성</option>
      </select>
    </label>
    <label>관심 고민 (복수 선택)
      <div class="checks">
        <label><input type="checkbox" name="concern" value="acne"> 트러블</label>
        <label><input type="checkbox" name="concern" value="wrinkle"> 주름</label>
        <label><input type="checkbox" name="concern" value="pigment"> 색소침착</label>
        <label><input type="checkbox" name="concern" value="pore"> 모공</label>
      </div>
    </label>
    <label>상담 희망 시간대
      <select name="preferred_time">
        <option value="morning">오전 (10~12시)</option>
        <option value="afternoon">오후 (13~17시)</option>
        <option value="evening">저녁 (18~20시)</option>
      </select>
    </label>
    <label>하고 싶은 말
      <textarea name="message" placeholder="현재 사용 중인 제품이나 궁금한 점을 적어 주세요."></textarea>
    </label>
    <label class="checks" style="margin-top:4px">
      <input type="checkbox" name="agree" value="yes" required> 개인정보 수집·이용에 동의합니다.
    </label>
    <button type="submit">무료 상담 신청하기</button>
  </form>
  <p class="note">신청 후 영업일 기준 1일 이내에 연락드립니다.</p>
</div>
</body>
</html>
