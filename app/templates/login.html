{% extends "base.html" %}
{% block title %}로그인 · 리드마그넷 CRM{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>운영자 로그인</h1>
  <form id="login" onsubmit="return doLogin(event)">
    <label>이메일 <input name="email" type="email" required autofocus></label>
    <label>비밀번호 <input name="password" type="password" required></label>
    <button type="submit">로그인</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script>
async function doLogin(ev){
  ev.preventDefault();
  const f=ev.target;
  const r=await api('POST','/admin/api/auth/login',{email:f.email.value,password:f.password.value});
  if(r.ok) location.href='/admin'; else flash(r.body.detail||'로그인 실패',true);
  return false;
}
</script>
{% endblock %}
